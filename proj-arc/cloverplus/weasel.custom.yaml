customization:
  distribution_code_name: Weasel
  distribution_version: 0.16.1
  generator: "Weasel::UIStyleSettings"
  modified_time: "Thu Aug 15 17:12:55 2024"
  rime_version: 1.11.2
patch:
  style:
    # 字体
    font_face: "思源黑体:medium"
    # label_font_face: "Source Han Sans SC Medium"
    # comment_font_face: "Source Han Sans SC Medium"
    font_point: 14
    label_font_point: 14
    comment_font_point: 14
    # 候选窗口
    fullscreen: false
    horizontal: false
    vertical_text: false
    # 输入区域
    inline_preedit: false
    preedit_type: composition
    # 布局
    layout:
      baseline: 0 
      linespacing: 0
      align_type: center
      max_height: 0 # 候选框最大高度 设置为 0 不启用此功能 
      max_width: 0
      min_height: 0
      min_width: 160
      border_height: 0                          # 边距 - 面板上下
      border_width: 0                           # 边距 - 面板左右地 
      margin_x: 5 # 主体元素和候选框的左右边距，为负值时，不显示候选框 
      margin_y: 0
      spacing: 3 # inline_preedit 为 false 时，编码区域和候选区域的间距
      candidate_spacing: 0 # 候选项之间的间距  
      hilite_spacing: 2  # 候选项和相应标签的间距，候选项与注解文字之间的距离 
      # hilite_padding: 2 # 高亮区域和内部文字的间距，影响高亮区域大小  
      hilite_padding_x: 2   
      hilite_padding_y: 0
      shadow_radius: 0  # 窗口阴影区域半径，为 0 不显示阴影；需要同时在配色方案中指定非透明的阴影颜色
      shadow_offset_x: 1 # 阴影绘制的偏离距离   
      shadow_offset_y: 1
      corner_radius: 5 # 候选窗口圆角半径
      round_corner: 5 # 候选背景色块圆角半径，别名 hilited_corner_radius
    
    color_scheme: custom1
  preset_color_schemes:
    custom1:   # 这里的名字可以随意定义，但一定不要忘了跟上面的 color_schema 对应  
      name: custom1 / 自定义1
      author: "felidz" 
      alpha: 1.0                               # 候选窗口透明度 
      color_format: rgba                       # 颜色格式：argb（0xaarrggbb）；rgba（0xrrggbbaa）；abgr（0xaabbggrr 默认）
      # 默认配色
      text_color: 0x2E3440                     # 文字 
      shadow_color: 0x000000b4                 # 阴影 
      label_color: 0x4C566A                    # 标签序号 
      comment_text_color: 0xD08770             # 注释
      # border_color: 0xECEFF4                   # 边框
      back_color: 0xeceff4c2                     # 背景  
      # 候选项配色
      # candidate_back_color: 0xECEFF4         # 背景
      # candidate_border_color:                # 边框
      # candidate_shadow_color:                # 阴影  
      # candidate_text_color: 0x2E3440         # 文字 
      # 高亮区域配色
      hilited_text_color: 0x000000             # 文字
      hilited_back_color: 0xffffff00             # 背景 
      # hilited_shadow_color:                  # 阴影
      # 选中的候选区域配色
      hilited_label_color: 0x4C566A            # 标签 
      hilited_comment_text_color: 0xBF616A     # 注释
      hilited_candidate_text_color: 0x2E3440   # 文字 
      hilited_candidate_border_color: 0x8fbcbbba # 边框 
      hilited_candidate_back_color: 0x8fbcbbba   # 背景  
      # hilited_candidate_shadow_color:        # 阴影
      # inline_preedit: false 时翻页箭头颜色，不设置则不显示箭头
      nextpage_color: 0xBF616A                 # 下一页
      prevpage_color: 0x000000                 # 上一页 