# Windows Weasel skin. Fcitx5 ignores this file.
# Palette from proj-arc/cloverplus/weasel.custom.yaml (Nord).
patch:
  style:
    font_face: "思源黑体:medium"
    font_point: 14
    label_font_point: 14
    comment_font_point: 14
    fullscreen: false
    horizontal: false
    vertical_text: false
    inline_preedit: false
    preedit_type: composition
    layout:
      baseline: 0
      linespacing: 0
      align_type: center
      max_height: 0
      max_width: 0
      min_height: 0
      min_width: 160
      border_height: 0
      border_width: 0
      margin_x: 5
      margin_y: 0
      spacing: 3
      candidate_spacing: 0
      hilite_spacing: 2
      hilite_padding_x: 2
      hilite_padding_y: 0
      shadow_radius: 0
      shadow_offset_x: 1
      shadow_offset_y: 1
      corner_radius: 5
      round_corner: 5
    color_scheme: kino_dark
    color_scheme_dark: kino_dark
  preset_color_schemes:
    kino:
      name: kino
      author: "felidz"
      alpha: 1.0
      color_format: rgba
      text_color: 0x2E3440
      shadow_color: 0x000000b4
      label_color: 0x4C566A
      comment_text_color: 0xD08770
      back_color: 0xeceff4c2
      hilited_text_color: 0x000000
      hilited_back_color: 0xffffff00
      hilited_label_color: 0x4C566A
      hilited_comment_text_color: 0xBF616A
      hilited_candidate_text_color: 0x2E3440
      hilited_candidate_border_color: 0x8fbcbbba
      hilited_candidate_back_color: 0x8fbcbbba
      nextpage_color: 0xBF616A
      prevpage_color: 0x000000
    kino_dark:
      name: kino-dark
      author: "felidz"
      alpha: 1.0
      color_format: rgba
      text_color: 0xECEFF4
      shadow_color: 0x000000b4
      label_color: 0x88C0D0
      comment_text_color: 0xD08770
      back_color: 0x2E3440e6
      hilited_text_color: 0xECEFF4
      hilited_back_color: 0x3B425200
      hilited_label_color: 0x8FBCBB
      hilited_comment_text_color: 0xBF616A
      hilited_candidate_text_color: 0x2E3440
      hilited_candidate_border_color: 0x8fbcbbba
      hilited_candidate_back_color: 0x8fbcbbba
      nextpage_color: 0xBF616A
      prevpage_color: 0xECEFF4
