# Rime schema
# encoding: utf-8

schema:
  schema_id: latin
  name: Latin
  version: "1"
  author:
    - kino overlay
    - rime-spanish / polyhedron
  description: |
    分号前缀拉丁重音。;n → ñ，;; → ；。源表 docs/drafts/latin-accents.csv。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 拉丁, ABC ]

engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ;?"
  delimiter: ""
  auto_select: true

menu:
  page_size: 10

translator:
  dictionary: latin
  enable_user_dict: false
  enable_sentence: false
  enable_completion: true
  prefix: ";"
  tips: "[á]"

punctuator:
  half_shape:
    " ": { commit: " " }
  full_shape:
    " ": { commit: " " }

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    latin: "^;[A-Za-z?;]+$"
